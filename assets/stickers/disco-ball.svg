<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ballBase" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfcfcf"/>
      <stop offset="70%" stop-color="#8c8c8c"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="50" cy="50" r="42"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="43" fill="#2b2b2b"/>
  <circle cx="50" cy="50" r="42" fill="url(#ballBase)"/>
  <g clip-path="url(#ballClip)" stroke="#3a3a3a" stroke-width="0.9" opacity="0.85">
    <!-- facet grid: horizontal lines following sphere curvature -->
    <ellipse cx="50" cy="50" rx="42" ry="9" fill="none"/>
    <ellipse cx="50" cy="50" rx="42" ry="20" fill="none"/>
    <ellipse cx="50" cy="50" rx="42" ry="31" fill="none"/>
    <ellipse cx="50" cy="50" rx="42" ry="42" fill="none"/>
    <ellipse cx="50" cy="8" rx="42" ry="9" fill="none"/>
    <ellipse cx="50" cy="92" rx="42" ry="9" fill="none"/>
    <!-- facet grid: vertical meridians -->
    <ellipse cx="50" cy="50" rx="9" ry="42" fill="none"/>
    <ellipse cx="50" cy="50" rx="20" ry="42" fill="none"/>
    <ellipse cx="50" cy="50" rx="31" ry="42" fill="none"/>
    <line x1="50" y1="8" x2="50" y2="92" stroke="#3a3a3a" stroke-width="0.9"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke="#3a3a3a" stroke-width="0.9"/>
  </g>
  <ellipse cx="36" cy="30" rx="10" ry="6" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="66" cy="66" rx="5" ry="3" fill="#ffffff" opacity="0.4"/>
</svg>
