<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90">
  <defs>
    <linearGradient id="chromeBulldog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="20%" stop-color="#f5f5f5"/>
      <stop offset="45%" stop-color="#9c9c9c"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#5e5e5e"/>
      <stop offset="100%" stop-color="#cfcfcf"/>
    </linearGradient>
    <linearGradient id="chromeBulldogArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c7c7c"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#6a6a6a"/>
    </linearGradient>
  </defs>
  <!-- back arms (ring handles) -->
  <path d="M25,38 C10,42 6,60 18,66" fill="none" stroke="url(#chromeBulldogArm)" stroke-width="6" stroke-linecap="round"/>
  <path d="M75,38 C90,42 94,60 82,66" fill="none" stroke="url(#chromeBulldogArm)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="18" cy="66" r="7" fill="none" stroke="url(#chromeBulldogArm)" stroke-width="5"/>
  <circle cx="82" cy="66" r="7" fill="none" stroke="url(#chromeBulldogArm)" stroke-width="5"/>
  <!-- clip body -->
  <path d="M15,30 L85,30 L72,55 L28,55 Z" fill="url(#chromeBulldog)" stroke="#3a3a3a" stroke-width="1.5"/>
  <rect x="10" y="18" width="80" height="16" rx="4" fill="url(#chromeBulldog)" stroke="#3a3a3a" stroke-width="1.5"/>
  <!-- hinge knob -->
  <circle cx="50" cy="18" r="10" fill="url(#chromeBulldog)" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="50" cy="18" r="4" fill="#4a4a4a"/>
  <rect x="16" y="21" width="68" height="3" fill="#ffffff" opacity="0.5"/>
</svg>
